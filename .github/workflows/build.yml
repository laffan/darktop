name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Build app bundle (universal)
        run: UNIVERSAL=1 scripts/build-app.sh

      - name: Check bundle
        run: |
          plutil -lint build/Darktop.app/Contents/Info.plist
          lipo -info build/Darktop.app/Contents/MacOS/Darktop
          codesign --verify --verbose build/Darktop.app

      - name: Smoke test (launch with red mode on, then SIGTERM)
        run: |
          build/Darktop.app/Contents/MacOS/Darktop --on > smoke.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Darktop exited early"; cat smoke.log; exit 1
          fi
          kill -TERM "$pid"
          status=0
          wait "$pid" || status=$?
          cat smoke.log
          echo "exit status: $status"
          test "$status" -eq 0

      - name: Package
        run: ditto -c -k --keepParent build/Darktop.app build/Darktop.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Darktop
          path: build/Darktop.zip
